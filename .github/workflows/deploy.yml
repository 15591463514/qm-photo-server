name: 构建并推送 Docker 镜像

on:
  push:
    branches:
      - master
      - feat/deploy-prod
    paths:
      - '**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker 镜像标签'
        required: false
        default: 'latest'

env:
  REGISTRY: crpi-eg9062f6byi3012b.cn-chengdu.personal.cr.aliyuncs.com
  NAMESPACE: dawn_dockers
  IMAGE_NAME: qm-photo-server

jobs:
  build-and-push:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: 生成镜像标签
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_SHA:0:7}"
            echo "latest=true" >> $GITHUB_OUTPUT
          fi
          echo "tag=${TAG:-latest}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG:-latest}"

      # 优化1: 尝试拉取之前的镜像作为 Docker 层缓存源
      - name: 拉取之前的镜像作为缓存
        id: pull-cache
        continue-on-error: true
        run: |
          echo "🔄 尝试拉取之前的镜像作为缓存源..."
          docker pull ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest || echo "未找到缓存镜像，将从头构建"
          echo "cache_available=$([ $? -eq 0 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      # 优化2: 缓存 node_modules 依赖（基于 pnpm-lock.yaml）
      - name: 缓存 Node 模块
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 优化3: 缓存 Prisma 生成的客户端
      - name: 缓存 Prisma 客户端
        id: cache-prisma
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma
            prisma/generated
          key: ${{ runner.os }}-prisma-${{ hashFiles('**/prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          # 多重缓存策略：优先使用 registry 镜像缓存，其次使用 GHA 缓存
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像信息
        run: |
          echo "✅ Docker 镜像构建和推送完成！"
          echo "镜像地址: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}"

      # 更新服务器镜像并重启服务（仅在构建成功时执行）
      - name: 更新服务器镜像并重启服务
        id: deploy
        if: success()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            bash ${{ secrets.SSH_SCRIPT_PATH }} "${{ steps.image-tag.outputs.tag }}" "${{ secrets.SSH_PROJECT_PATH }}" "${{ secrets.ALIYUN_DOCKER_PASSWORD }}"
            echo '=====镜像更新完成====='
            echo '=====服务重启完成====='

      # 发送邮件通知（构建完成或失败时都发送）
      - name: 发送邮件通知
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: |
            ${{ job.status == 'success' && '✅' || '❌' }} Docker 镜像构建 ${{ job.status == 'success' && '成功' || '失败' }} - ${{ github.repository }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}
          html_body: |
            <h2>${{ job.status == 'success' && '✅ 构建成功' || '❌ 构建失败' }}</h2>

            <h3>基本信息</h3>
            <ul>
              <li><strong>仓库:</strong> ${{ github.repository }}</li>
              <li><strong>分支:</strong> ${{ github.ref_name }}</li>
              <li><strong>提交:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></li>
              <li><strong>提交信息:</strong> ${{ github.event.head_commit.message || github.event.commits[0].message || 'N/A' }}</li>
              <li><strong>作者:</strong> ${{ github.actor }}</li>
              <li><strong>工作流:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">查看详情</a></li>
            </ul>

            <h3>构建信息</h3>
            <ul>
              <li><strong>镜像标签:</strong> ${{ steps.image-tag.outputs.tag }}</li>
              <li><strong>镜像地址:</strong> ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}</li>
              <li><strong>构建状态:</strong> ${{ job.status == 'success' && '✅ 成功' || '❌ 失败' }}</li>
            </ul>

            ${{ job.status == 'success' && steps.deploy.outcome == 'success' && '<h3>部署信息</h3><ul><li><strong>部署状态:</strong> ✅ 已成功部署到服务器</li></ul>' || '' }}

            ${{ job.status == 'failure' && '<h3>错误信息</h3><p>请查看工作流日志获取详细错误信息：<a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">点击查看</a></p>' || '' }}

            <hr>
            <p style="color: #999; font-size: 12px;">此邮件由 GitHub Actions 自动发送</p>
