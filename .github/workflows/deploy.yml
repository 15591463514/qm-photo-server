name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - feat/deploy-prod
    paths:
      - '**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  REGISTRY: crpi-eg9062f6byi3012b.cn-chengdu.personal.cr.aliyuncs.com
  NAMESPACE: dawn_dockers
  IMAGE_NAME: qm-photo-server

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 添加超时设置

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Generate image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_SHA:0:7}"
            echo "latest=true" >> $GITHUB_OUTPUT
          fi
          echo "tag=${TAG:-latest}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG:-latest}"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: false # 先不推送，只构建
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load and push image (commit tag)
        run: |
          echo "📦 加载镜像..."
          docker load -i /tmp/image.tar
          echo "🚀 推送镜像标签: ${{ steps.image-tag.outputs.tag }}"
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}
          echo "✅ 已推送: ${{ steps.image-tag.outputs.tag }}"

      - name: Tag and push latest
        if: steps.image-tag.outputs.latest == 'true'
        run: |
          echo "🏷️  标记 latest 标签..."
          docker tag ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }} ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          echo "🚀 推送 latest 标签..."
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ 已推送 latest 标签"

      - name: Output image info
        run: |
          echo "✅ Docker 镜像构建和推送完成！"
          echo "镜像地址: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}"
          echo ""
          echo "在服务器上拉取镜像："
          echo "docker pull ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}"
