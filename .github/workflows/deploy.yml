name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - feat/deploy-prod
    paths:
      - '**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  REGISTRY: crpi-eg9062f6byi3012b.cn-chengdu.personal.cr.aliyuncs.com
  NAMESPACE: dawn_dockers
  IMAGE_NAME: qm-photo-server

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Generate image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_SHA:0:7}"
            echo "latest=true" >> $GITHUB_OUTPUT
          fi
          echo "tag=${TAG:-latest}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG:-latest}"

      # 优化1: 尝试拉取之前的镜像作为 Docker 层缓存源
      - name: Pull previous image for cache
        id: pull-cache
        continue-on-error: true
        run: |
          echo "🔄 尝试拉取之前的镜像作为缓存源..."
          docker pull ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest || echo "未找到缓存镜像，将从头构建"
          echo "cache_available=$([ $? -eq 0 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      # 优化2: 缓存 node_modules 依赖（基于 pnpm-lock.yaml）
      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 优化3: 缓存 Prisma 生成的客户端
      - name: Cache Prisma client
        id: cache-prisma
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/@prisma
            prisma/generated
          key: ${{ runner.os }}-prisma-${{ hashFiles('**/prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          # 多重缓存策略：优先使用 registry 镜像缓存，其次使用 GHA 缓存
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "✅ Docker 镜像构建和推送完成！"
          echo "镜像地址: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}"
          echo ""
          echo "在服务器上拉取镜像："
          echo "docker pull ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}"
          echo ""
          echo "或者使用 latest 标签："
          echo "docker pull ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest"

      # 通知服务器部署（仅在构建成功时执行）
      - name: Notify server to deploy
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ] && [ -n "${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" ]; then
            echo "🚀 通知服务器开始部署..."
            curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
              -d "{
                \"tag\": \"${{ steps.image-tag.outputs.tag }}\",
                \"image\": \"${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}\",
                \"status\": \"success\",
                \"commit\": \"${{ github.sha }}\",
                \"branch\": \"${{ github.ref_name }}\",
                \"author\": \"${{ github.actor }}\",
                \"message\": \"${{ github.event.head_commit.message }}\"
              }" \
              --max-time 10 \
              --retry 2 \
              --retry-delay 1
            
            if [ $? -eq 0 ]; then
              echo "✅ 服务器通知成功"
            else
              echo "⚠️ 服务器通知失败，但不影响构建流程"
            fi
          else
            echo "ℹ️ 未配置 Webhook URL 或 Token，跳过服务器通知"
          fi
